name: CI
on:
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == 'main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  server_lifecycle:
    name: Server lifecycle regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DWEBUI_BUILD_EXAMPLES=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: write

  macos:
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: write

  linux:
    uses: ./.github/workflows/linux.yml
    permissions:
      contents: write

  linux_arm:
    uses: ./.github/workflows/linux_arm.yml
    permissions:
      contents: write

  linux_redhat:
    uses: ./.github/workflows/linux_redhat.yml
    permissions:
      contents: write

  linux_arch:
    uses: ./.github/workflows/linux_arch.yml
    permissions:
      contents: write

  zig:
    uses: ./.github/workflows/zig.yml
